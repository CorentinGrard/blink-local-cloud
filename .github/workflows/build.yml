name: build image

# Test, then build the server image and push it to GitHub Container Registry
# (ghcr.io). The NAS runs Arcane, which pulls
# ghcr.io/corentingrard/blink-local-cloud:latest (see compose.yaml). Pushing to
# main publishes a new :latest; git tags vX.Y.Z publish an immutable version tag
# too. Pull requests run the checks and the in-image tests but push nothing.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # don't rebuild for doc/compose-only changes
    paths-ignore:
      - "**.md"
      - "compose.yaml"
      - ".gitignore"
      - ".dockerignore"
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/corentingrard/blink-local-cloud

jobs:
  checks:
    # Lint + the test suite on the runner. It has node (page-script syntax
    # check) but no ffmpeg, so the talk tests skip here and run in the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (pyflakes)
        run: |
          pip install pyflakes
          pyflakes tools/ tests/
      - name: Tests
        run: python -m unittest discover -s tests -v

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # the TrueNAS box is x86_64
          load: true
          tags: blink-local-cloud:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests inside the image (its own ffmpeg)
        run: >
          docker run --rm -v "$PWD:/src" -w /src
          -e BLINK_LOG_DIR=/tmp/blink-test -e PYTHONDONTWRITEBYTECODE=1
          blink-local-cloud:test
          python3 -m unittest discover -s tests -v

      - name: Image tags & labels
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha       # same build as above: all layers cached
