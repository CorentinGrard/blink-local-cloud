name: build image

# Build the server image and push it to GitHub Container Registry (ghcr.io).
# The NAS runs Arcane, which pulls ghcr.io/corentingrard/blink-local-cloud:latest
# (see compose.yaml). Pushing to main publishes a new :latest; git tags vX.Y.Z
# publish an immutable version tag too.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # don't rebuild for doc/compose-only changes
    paths-ignore:
      - "**.md"
      - "compose.yaml"
      - ".gitignore"
      - ".dockerignore"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/corentingrard/blink-local-cloud

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # the TrueNAS box is x86_64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
